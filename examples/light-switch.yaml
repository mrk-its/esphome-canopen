# Wall switch controlling the lights of the `light` node (light.yaml) over CAN,
# without Home Assistant in the loop. See docs/linking-nodes.md.
packages:
  common: !include common.yaml

esphome:
  name: light-switch

canopen:
  id: can_open
  node_id: 8
  remote_nodes:
    light: light.yaml  # TPDO layout and entity ids are read from this file
  entities:
    - id: boot_button
      index: 1
      tpdo: 0

# remote light states, received from the light node's TPDOs
binary_sensor:
  - platform: canopen
    id: light1_state
    name: "Test Light 1 State"
    node: light
    entity: light1

  - platform: canopen
    id: light2_state
    name: "Test Light 2 State"
    node: light
    entity: light2

  - platform: gpio
    name: "Boot Button"
    id: boot_button
    pin:
      number: GPIO9
      inverted: true
      mode:
        input: true
        pullup: true
    on_press:
      # both lights off if any of them is on, otherwise both on
      - if:
          condition:
            or:
              - binary_sensor.is_on: light1_state
              - binary_sensor.is_on: light2_state
          then:
            - canopen.light.turn_off: {node: light, entity: light1}
            - canopen.light.turn_off: {node: light, entity: light2}
          else:
            - canopen.light.turn_on: {node: light, entity: light1}
            - canopen.light.turn_on: {node: light, entity: light2}

  - platform: gpio
    name: "Light 3 Button"
    pin:
      number: GPIO10
      inverted: true
      mode:
        input: true
        pullup: true
    on_press:
      - canopen.light.toggle: {node: light, entity: light3}

sensor:
  - platform: canopen
    id: light1_brightness
    name: "Test Light 1 Brightness"
    node: light
    entity: light1
    state: brightness

  - platform: canopen
    id: light2_brightness
    name: "Test Light 2 Brightness"
    node: light
    entity: light2
    state: brightness
