  - source: ../components_next

esphome:
  name: stm32l4-blinking-led

zephyr:
  variant: STM32L4
  # board: nucleo_l476rg/stm32l476xx
  board: nucleo_l476rg
  advanced:
    runner: openocd
    bootloader: mcuboot
  # nucleo_l476rg has no MCUboot layout upstream, so carve the 1 MB flash into
  # boot (64K) / slot0 / slot1 (464K each), keeping the board's 32K storage at 0xf8000.
  overlays:
    app: |
      /delete-node/ &storage_partition;

      &flash0 {
          partitions {
              boot_partition: partition@0 {
                  label = "mcuboot";
                  reg = <0x0 DT_SIZE_K(64)>;
              };
              slot0_partition: partition@10000 {
                  label = "image-0";
                  reg = <0x10000 0x74000>;
              };
              slot1_partition: partition@84000 {
                  label = "image-1";
                  reg = <0x84000 0x74000>;
              };
              storage_partition: partition@f8000 {
                  label = "storage";
                  reg = <0xf8000 DT_SIZE_K(32)>;
              };
          };
      };

      / {
          chosen {
              zephyr,code-partition = &slot0_partition;
          };
      };
    mcuboot: |
      /delete-node/ &storage_partition;

      &flash0 {
          partitions {
              boot_partition: partition@0 {
                  label = "mcuboot";
                  reg = <0x0 DT_SIZE_K(64)>;
              };
              slot0_partition: partition@10000 {
                  label = "image-0";
                  reg = <0x10000 0x74000>;
              };
              slot1_partition: partition@84000 {
                  label = "image-1";
                  reg = <0x84000 0x74000>;
              };
              storage_partition: partition@f8000 {
                  label = "storage";
                  reg = <0xf8000 DT_SIZE_K(32)>;
              };
          };
      };

      / {
          chosen {
              zephyr,code-partition = &boot_partition;
          };
      };

logger:
#  hardware_uart: UART0
  logs:
    # canbus logs every received frame at DEBUG; over a 115200 UART that is far slower
    # than CAN frames arrive during SDO block transfer (CAN OTA)
    canbus: INFO
    script: INFO

output:
  - platform: gpio
    pin: 5  # PA5
    id: led_output

script:
  - id: frame_blink
    mode: restart
    then:
      - output.turn_on: led_output
      - delay: 50ms
      - output.turn_off: led_output

# interval:
#   - interval: 500ms
#     startup_delay: 1s
#     then:
#       - output.turn_on: led_output
#       - delay: 100ms
#       - output.turn_off: led_output

sensor:
  - platform: uptime
    name: "Uptime"
    update_interval: 60s

canbus:
  - platform: zephyr_can
    id: can_bus
    can_id: 0
    bit_rate: 125kbps
    # SDO block transfer sends up to 63 frames back to back (default queue: 8)
    rx_buffer_size: 64
    tx_buffer_size: 32
    rx_pin: PA11
    tx_pin: PA12
    on_frame:
      can_id: 0x700
      can_id_mask: 0xf80
      then:
        # - lambda: |-
        #     ESP_LOGI("canopen-hb", "💓 node #%02x", can_id & 0x7f);
        - script.execute: frame_blink
canopen:
  id: can_gate
  canbus_id: can_bus
  node_id: 0x7f
  # SDO block size the node announces: smaller blocks mean less to retransmit after
  # a lost frame during CAN OTA, larger ones fewer ack round trips
  sdo_block_transfer_size: 63
  heartbeat_interval: 1s
  heartbeat_clients:
    - node_id: 0x01
      timeout: 7s  # node 0x01 sends a heartbeat every 5 s
  on_hb_consumer_event:
    - logger.log:
        format: "heartbeat lost: node 0x%02x"
        args: [node_id]
