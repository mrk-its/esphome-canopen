external_components:
  # - source: github://pr#12717
  #   components: [ds248x]
  # - source: github://mrk-its/esphome-canopen
  # - source: ../components_next
  # canopen from the upstream PR branches (whatever is checked out in ../../esphome)
  - source:
      type: local
      path: ../../esphome/esphome/components
    components: [canopen]
  # entity mapper (step 7)
  - source: ../components_next
    components: [canopen_entity_mapper]
  # profile API hardware test (canopen_test_profile below)
  - source: external

esphome:
  name: stm32l4-blinking-led
  # SDO client / NMT master hardware test (node 0x61 and our own node), see the file
  includes:
    - sdo_test.h
    - od_handler_test.h
  on_boot:
    - lambda: |-
        // PR 8: OD handlers, added before the hub's setup() (on_boot runs at priority 600, the hub at 400)
        od_handler_test::register_objects(id(can_gate));
        // TPDO1 of every node (0x181..0x1ff)
        id(can_gate).add_frame_listener(0x180, 0x780, +[](void *, uint32_t can_id, const uint8_t *data, uint8_t len) {
          ESP_LOGI("test", "rx 0x%03x, %u bytes, first 0x%02x", (unsigned) can_id, len, len ? data[0] : 0);
        }, nullptr);
        // SDO requests to our server (0x600 + 0x7f), e.g. from can2mqtt
        id(can_gate).add_frame_listener(0x67F, 0x7FF, +[](void *, uint32_t, const uint8_t *data, uint8_t len) {
          ESP_LOGI("test", "SDO request to us: cmd 0x%02x, 0x%02x%02x:%u", data[0], data[2], data[1], data[3]);
        }, nullptr);
        // overlaps the heartbeat consumer for node 0x01: setup() logs a warning
        id(can_gate).add_frame_listener(0x700, 0x780, +[](void *, uint32_t, const uint8_t *, uint8_t) {}, nullptr);
    - delay: 5s
    - lambda: sdo_test::start(id(can_gate), 0x7f);
    - delay: 75s
    - script.execute: canopen_actions
    # PR 7: our own device info / identity, read with the local SDO client (OD contents, not the server path)
    - delay: 5s
    - lambda: |-
        static auto log_str = +[](void *context, const canopen::SDOReply &r) {
          ESP_LOGI("test", "own 0x%04x: %s '%.*s'", (unsigned) (uintptr_t) context,
                   LOG_STR_ARG(canopen::sdo_result_to_string(r.result)), (int) r.len, (const char *) r.data);
        };
        for (uint16_t index : {0x1008, 0x1009, 0x100A})
          id(can_gate).read_sdo_data(0x7f, index, 0, log_str, (void *) (uintptr_t) index);
        // entity metadata strings, generated by the mapper's handler (name, device class, unit, state class)
        static auto log_meta = +[](void *context, const canopen::SDOReply &r) {
          ESP_LOGI("test", "own meta 0x%04x: %s '%.*s'", (unsigned) (uintptr_t) context,
                   LOG_STR_ARG(canopen::sdo_result_to_string(r.result)), (int) r.len, (const char *) r.data);
        };
        for (uint8_t sub = 1; sub <= 4; sub++)
          id(can_gate).read_sdo_data(0x7f, 0x2010, sub, log_meta, (void *) (uintptr_t) (0x2010 << 8 | sub));
        id(can_gate).read_sdo_data(0x7f, 0x2070, 1, log_meta, (void *) (uintptr_t) (0x2070 << 8 | 1));
        id(can_gate).read_sdo<uint32_t>(0x7f, 0x1018, 1, +[](void *, const canopen::SDOReply &r) {
          ESP_LOGI("test", "own 0x1018:1 (vendor id): %s 0x%08x", LOG_STR_ARG(canopen::sdo_result_to_string(r.result)),
                   (unsigned) r.value);
        }, nullptr);
    - delay: 2s
    # entity commands (0x2002 + 16 * N) written with the local SDO client, then the states they cause
    - lambda: |-
        static auto log_write = +[](void *context, const canopen::SDOReply &r) {
          ESP_LOGI("test", "command 0x%06x: %s", (unsigned) (uintptr_t) context,
                   LOG_STR_ARG(canopen::sdo_result_to_string(r.result)));
        };
        auto cmd = [](uint16_t index, uint8_t sub, uint32_t value, uint8_t size) {
          id(can_gate).write_sdo(0x7f, index, sub, value, size, log_write, (void *) (uintptr_t) (index << 8 | sub));
        };
        cmd(0x2042, 1, 1, 1);      // switch on
        cmd(0x2052, 1, 49151, 2);  // number: 49151 of 65534 in -50..50 = 25.0
        cmd(0x2062, 2, 127, 1);    // cover position 50 %
        cmd(0x2072, 1, 1, 1);      // light on
        cmd(0x2072, 2, 127, 1);    // light brightness 50 %
        cmd(0x2082, 1, 1, 1);      // alarm: arm away
        cmd(0x2032, 1, 1, 1);      // binary sensor: publish on
    - delay: 1s
    - lambda: |-
        ESP_LOGI("test", "after commands: switch %s, number %.2f, cover position %.2f, light %s brightness %.2f, "
                 "alarm %s, binary %s", ONOFF(id(test_switch).state), id(test_number).state, id(test_cover).position,
                 ONOFF(id(test_light).remote_values.is_on()), id(test_light).remote_values.get_brightness(),
                 LOG_STR_ARG(alarm_control_panel_state_to_string(id(test_alarm).get_state())),
                 ONOFF(id(test_binary).state));
        // the state records follow (read back over SDO): switch, light brightness
        id(can_gate).read_sdo<uint8_t>(0x7f, 0x2041, 1, +[](void *, const canopen::SDOReply &r) {
          ESP_LOGI("test", "state 0x2041:1 (switch): %u", (unsigned) r.value);
        }, nullptr);
        id(can_gate).read_sdo<uint8_t>(0x7f, 0x2071, 2, +[](void *, const canopen::SDOReply &r) {
          ESP_LOGI("test", "state 0x2071:2 (light brightness): %u", (unsigned) r.value);
        }, nullptr);
    # OD writer: received frames (injected: our own frames don't come back from the bus) and send_od_write() to us
    - delay: 1s
    - lambda: |-
        const uint8_t switch_off[5] = {0x7f, 1, 0x42, 0x20, 0};  // 0x2042:1 = 0
        const uint8_t other_node[5] = {0x61, 1, 0x42, 0x20, 1};  // for node 0x61: ignored
        const uint8_t bad_index[5] = {0x7f, 1, 0x99, 0x50, 1};   // 0x5099: no such entry (warning)
        const uint8_t short_frame[4] = {0x7f, 1, 0x42, 0x20};    // no value: ignored
        id(mapper).handle_od_writer_frame(switch_off, 5);
        id(mapper).handle_od_writer_frame(other_node, 5);
        id(mapper).handle_od_writer_frame(bad_index, 5);
        id(mapper).handle_od_writer_frame(short_frame, 4);
        bool local = id(mapper).send_od_write(0x7f, 0x2072, 1, 0, 1);  // light off, written directly
        ESP_LOGI("test", "OD writer: switch %s (expect OFF), send_od_write to us %s, light %s (expect OFF)",
                 ONOFF(id(test_switch).state), YESNO(local), ONOFF(id(test_light).remote_values.is_on()));
        // a real one over the bus: dimmer4 (node 0x37, old component) light5 "biuro" off (0x2052:1 = 0)
        bool sent = id(mapper).send_od_write(0x37, 0x2052, 1, 0, 1);
        ESP_LOGI("test", "OD writer: dimmer4 light5 (biuro) off sent: %s", YESNO(sent));
    - delay: 1s
    - lambda: |-
        id(can_gate).read_sdo<uint8_t>(0x37, 0x2051, 1, +[](void *, const canopen::SDOReply &r) {
          ESP_LOGI("test", "dimmer4 light5 (biuro) state 0x2051:1: %s %u (expect 0)",
                   LOG_STR_ARG(canopen::sdo_result_to_string(r.result)), (unsigned) r.value);
        }, nullptr);
    - lambda: od_handler_test::run(0x7f);

zephyr:
  variant: STM32L4
  # board: nucleo_l476rg/stm32l476xx
  board: nucleo_l476rg
  advanced:
    runner: openocd
    bootloader: mcuboot
  # nucleo_l476rg has no MCUboot layout upstream, so carve the 1 MB flash into
  # boot (64K) / slot0 / slot1 (464K each), keeping the board's 32K storage at 0xf8000.
  overlays:
    app: |
      /delete-node/ &storage_partition;

      &flash0 {
          partitions {
              boot_partition: partition@0 {
                  label = "mcuboot";
                  reg = <0x0 DT_SIZE_K(64)>;
              };
              slot0_partition: partition@10000 {
                  label = "image-0";
                  reg = <0x10000 0x74000>;
              };
              slot1_partition: partition@84000 {
                  label = "image-1";
                  reg = <0x84000 0x74000>;
              };
              storage_partition: partition@f8000 {
                  label = "storage";
                  reg = <0xf8000 DT_SIZE_K(32)>;
              };
          };
      };

      / {
          chosen {
              zephyr,code-partition = &slot0_partition;
          };
      };
    mcuboot: |
      /delete-node/ &storage_partition;

      &flash0 {
          partitions {
              boot_partition: partition@0 {
                  label = "mcuboot";
                  reg = <0x0 DT_SIZE_K(64)>;
              };
              slot0_partition: partition@10000 {
                  label = "image-0";
                  reg = <0x10000 0x74000>;
              };
              slot1_partition: partition@84000 {
                  label = "image-1";
                  reg = <0x84000 0x74000>;
              };
              storage_partition: partition@f8000 {
                  label = "storage";
                  reg = <0xf8000 DT_SIZE_K(32)>;
              };
          };
      };

      / {
          chosen {
              zephyr,code-partition = &boot_partition;
          };
      };

logger:
#  hardware_uart: UART0
  logs:
    # canbus logs every received frame at DEBUG; over a 115200 UART that is far slower
    # than CAN frames arrive during SDO block transfer (CAN OTA)
    canbus: INFO
    script: INFO

output:
  - platform: gpio
    pin: 5  # PA5
    id: led_output
  # for the test light
  - platform: template
    id: dummy_output
    type: float
    write_action:
      - logger.log:
          format: "test light output %.2f"
          args: [state]

script:
  # canopen.sdo_write / canopen.nmt (they also compile the SDO client and NMT master in)
  - id: canopen_actions
    then:
      - canopen.sdo_write:
          node_id: 0x7f
          index: 0x1017
          value: 1000
          size: 2
          on_success:
            - logger.log: "sdo_write action: success"
          on_error:
            - logger.log:
                format: "sdo_write action: %s, abort 0x%08x"
                args: ["LOG_STR_ARG(esphome::canopen::sdo_result_to_string(result))", "(unsigned) abort_code"]
      - canopen.sdo_write:
          node_id: 0x61
          index: 0x5FFF
          value: 1
          size: 1
          on_error:
            - logger.log:
                format: "sdo_write action to 0x5FFF: %s, abort 0x%08x (expected abort 0x06020000)"
                args: ["LOG_STR_ARG(esphome::canopen::sdo_result_to_string(result))", "(unsigned) abort_code"]
      - canopen.nmt:
          node_id: 0x61
          command: start
  - id: frame_blink
    mode: restart
    then:
      - output.turn_on: led_output
      - delay: 50ms
      - output.turn_off: led_output

# interval:
#   - interval: 500ms
#     startup_delay: 1s
#     then:
#       - output.turn_on: led_output
#       - delay: 100ms
#       - output.turn_off: led_output

sensor:
  - platform: uptime
    id: uptime_sensor
    name: "Uptime"
    update_interval: 10s
  - platform: template
    id: test_percent
    name: "Test percent"
    unit_of_measurement: "%"

canbus:
  - platform: zephyr_can
    id: can_bus
    can_id: 0
    bit_rate: 125kbps
    # SDO block transfer sends up to 63 frames back to back (default queue: 8)
    rx_buffer_size: 64
    tx_buffer_size: 32
    rx_pin: PA11
    tx_pin: PA12
    on_frame:
      can_id: 0x700
      can_id_mask: 0xf80
      then:
        # - lambda: |-
        #     ESP_LOGI("canopen-hb", "💓 node #%02x", can_id & 0x7f);
        - script.execute: frame_blink
canopen:
  id: can_gate
  canbus_id: can_bus
  node_id: 0x7f
  heartbeat_interval: 1s
  hardware_version: nucleo_l476rg
  # PR 8: start pre-operational, then switch ourselves to operational (no NMT master needed)
  nmt_startup: pre_operational
  on_nmt_state_change:
    - logger.log:
        format: "own NMT state: %s"
        args: ["LOG_STR_ARG(esphome::canopen::nmt_state_to_string(state))"]
    - if:
        condition:
          lambda: return state == esphome::canopen::NMTState::NMT_STATE_PRE_OPERATIONAL;
        then:
          - delay: 3s
          - lambda: |-
              ESP_LOGI("test", "set_nmt_state(OPERATIONAL): %s",
                       YESNO(id(can_gate).set_nmt_state(esphome::canopen::NMTState::NMT_STATE_OPERATIONAL)));
  heartbeat_clients:
    - node_id: 0x01
      timeout: 7s  # node 0x01 sends a heartbeat every 5 s
    # duplicate on purpose: merged into one 0x1016 entry with the shorter timeout (7 s)
    - node_id: 0x01
      timeout: 10s
    # SDO / NMT test node (sdo_test.h)
    - node_id: 0x61
      timeout: 15s
  on_node_event:
    - logger.log:
        format: "node event: node 0x%02x %s, %s"
        args:
          - node_id
          - "LOG_STR_ARG(esphome::canopen::node_event_to_string(event))"
          - "LOG_STR_ARG(esphome::canopen::nmt_state_to_string(state))"
  on_heartbeat:
    - if:
        condition:
          lambda: return node_id == 0x61;
        then:
          - logger.log:
              format: "heartbeat: node 0x%02x %s"
              args: [node_id, "LOG_STR_ARG(esphome::canopen::nmt_state_to_string(state))"]
  on_emcy:
    - logger.log:
        format: "EMCY: node 0x%02x code 0x%04x register 0x%02x"
        args: [node_id, emergency.error_code, emergency.error_register]

# profile API (CANopenNode base class) on node 0x61: logs its hooks, checks the SDO forwarders and cancel_sdo().
# The timeout is merged with heartbeat_clients (15 s): monitored with 12 s.
canopen_test_profile:
  - id: test_profile
    canopen_id: can_gate
    node_id: 0x61
    heartbeat_timeout: 12s

interval:
  - interval: 10s
    then:
      - lambda: |-
          static bool on = false;
          on = !on;
          id(test_binary).publish_state(on);
          id(test_percent).publish_state(fmod(millis() / 1000.0f, 100.0f));
  - interval: 5s
    then:
      - lambda: |-
          // no receiver on 0x37f: the frame must still be acked (TX errors stay 0)
          static uint8_t n = 0;
          uint8_t data[1] = {n++};
          ESP_LOGI("test", "send_frame 0x37f: %s", id(can_gate).send_frame(0x37F, data, 1) ? "ok" : "refused");

# entity mapper (step 7): exposed to can2mqtt (ESPHome identity, entity layout, TPDOs)
binary_sensor:
  - platform: template
    id: test_binary
    name: "Test binary"

canopen_entity_mapper:
  id: mapper
  canopen_id: can_gate
  entities:
    - id: uptime_sensor
      index: 1
      tpdo: 0
    - id: test_percent
      index: 2
      size: 1
      min_value: 0
      max_value: 100
      tpdo: 0
    - id: test_binary
      index: 3
      tpdo: 1
    - id: test_switch
      index: 4
      tpdo: 1
    - id: test_number
      index: 5
      size: 2
      min_value: -50
      max_value: 50
      tpdo: 2
    - id: test_cover
      index: 6
      tpdo: 3
    - id: test_light
      index: 7
      tpdo: 3
    - id: test_alarm
      index: 8
      tpdo: 4

switch:
  - platform: template
    id: test_switch
    name: "Test switch"
    optimistic: true

number:
  - platform: template
    id: test_number
    name: "Test number"
    optimistic: true
    min_value: -50
    max_value: 50
    step: 0.5

cover:
  - platform: template
    id: test_cover
    name: "Test cover"
    optimistic: true
    has_position: true

light:
  - platform: monochromatic
    id: test_light
    name: "Test light"
    output: dummy_output

alarm_control_panel:
  - platform: template
    id: test_alarm
    name: "Test alarm"
