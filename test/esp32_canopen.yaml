# ESP32 build check for components_next/canopen (CANopenNode), with upstream ESPHome (dev venv, see CLAUDE.md):
#   ~/repos/esphome-upstream-venv/bin/esphome compile test/esp32_canopen.yaml
# Arduino: add -s framework arduino.
substitutions:
  framework: esp-idf

external_components:
  - source: ../components_next

esphome:
  name: esp32-canopen

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: ${framework}

logger:

canbus:
  - platform: esp32_can
    id: can_bus
    can_id: 0
    bit_rate: 125kbps
    rx_pin: GPIO5
    tx_pin: GPIO4

canopen:
  canbus_id: can_bus
  node_id: 0x7e
  heartbeat_interval: 1s
  heartbeat_clients:
    - node_id: 0x01
      timeout: 7s
  on_node_event:
    - lambda: |-
        if (event == esphome::canopen::NodeEvent::NODE_EVENT_OFFLINE)
          ESP_LOGW("test", "node 0x%02x offline", node_id);
  on_heartbeat:
    - logger.log:
        format: "heartbeat: node 0x%02x %s"
        args: [node_id, "esphome::canopen::nmt_state_to_string(state)"]
  on_emcy:
    - lambda: |-
        ESP_LOGW("test", "EMCY node 0x%02x code 0x%04x", node_id, emergency.error_code);

interval:
  - interval: 60s
    then:
      - canopen.sdo_write:
          node_id: 0x01
          index: 0x1017
          value: 5000
          size: 2
          on_error:
            - logger.log:
                format: "sdo_write: %s"
                args: ["esphome::canopen::sdo_result_to_string(result)"]
      - canopen.nmt:
          node_id: 0x01
          command: start
