# ESP8266 build check for canopen_entities on the canopen hub (components/canopen, synced from mrk-its/esphome canopen-full),
# with upstream ESPHome (dev venv): ~/repos/esphome-upstream-venv/bin/esphome compile test/esp8266_mapper.yaml

external_components:
  # the hub (a copy, scripts/sync_hub.py) and canopen_entities
  - source: ../components
    components: [canopen, canopen_entities]

esphome:
  name: esp8266-mapper

esp8266:
  board: d1_mini

logger:

spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13
  miso_pin: GPIO12

canbus:
  - platform: mcp2515
    id: can_bus
    cs_pin: GPIO15
    can_id: 0
    bit_rate: 125kbps

canopen:
  id: can_hub
  canbus_id: can_bus
  node_id: 0x7d

sensor:
  - platform: uptime
    id: uptime_sensor
    name: Uptime

binary_sensor:
  - platform: template
    id: test_binary
    name: Test binary
    device_class: door

switch:
  - platform: template
    id: test_switch
    name: Test switch
    optimistic: true

canopen_entities:
  canopen_id: can_hub
  # links to another node (only read): remote state slots, platform entities, actions, rpdo
  remote_nodes:
    dimmer: remote_node.yaml
  # remote logs (OD 0x3100), default block size 3
  remote_logs: {}
  entities:
    - id: uptime_sensor
      index: 1
      tpdo: 0
    - id: test_binary
      index: 2
      tpdo: 0
    - id: test_switch
      index: 3
      tpdo: 0
      rpdo: {node: dimmer, entity: relay}

text_sensor:
  - platform: canopen_entities
    id: hall_cover
    node: dimmer
    entity: cover_hall

button:
  - platform: template
    name: Hall toggle
    on_press:
      - canopen_entities.light.toggle: {node: dimmer, entity: light_hall}
      - canopen_entities.number.set: {node: dimmer, entity: setpoint, value: 21.5}

# CAN OTA (zlib-compressed images: miniz)
ota:
  - platform: canopen_entities
