# Nucleo as a wall switch on the canopen hub + canopen_entity_mapper: the user button B1 toggles dimmer4's light5
# ("biuro", node 0x37 on the old component) with canopen.light.toggle; the green LED blinks on CAN traffic. Build / flash
# with the esphomeplatformzephyr venv:
#   ../esphomeplatformzephyr/venv/bin/esphome run test/stm32l4_biuro_switch.yaml
# (same board and partition layout as stm32l4_canopen.yaml, which has the hardware tests)

external_components:
  # canopen from the upstream PR branches (whatever is checked out in ../../esphome)
  - source:
      type: local
      path: ../../esphome/esphome/components
    components: [canopen]
  - source: ../components_next
    components: [canopen_entity_mapper]

esphome:
  name: stm32l4-biuro-switch

zephyr:
  variant: STM32L4
  # board: nucleo_l476rg/stm32l476xx
  board: nucleo_l476rg
  advanced:
    runner: openocd
    bootloader: mcuboot
  # nucleo_l476rg has no MCUboot layout upstream, so carve the 1 MB flash into
  # boot (64K) / slot0 / slot1 (464K each), keeping the board's 32K storage at 0xf8000.
  overlays:
    app: |
      /delete-node/ &storage_partition;

      &flash0 {
          partitions {
              boot_partition: partition@0 {
                  label = "mcuboot";
                  reg = <0x0 DT_SIZE_K(64)>;
              };
              slot0_partition: partition@10000 {
                  label = "image-0";
                  reg = <0x10000 0x74000>;
              };
              slot1_partition: partition@84000 {
                  label = "image-1";
                  reg = <0x84000 0x74000>;
              };
              storage_partition: partition@f8000 {
                  label = "storage";
                  reg = <0xf8000 DT_SIZE_K(32)>;
              };
          };
      };

      / {
          chosen {
              zephyr,code-partition = &slot0_partition;
          };
      };
    mcuboot: |
      /delete-node/ &storage_partition;

      &flash0 {
          partitions {
              boot_partition: partition@0 {
                  label = "mcuboot";
                  reg = <0x0 DT_SIZE_K(64)>;
              };
              slot0_partition: partition@10000 {
                  label = "image-0";
                  reg = <0x10000 0x74000>;
              };
              slot1_partition: partition@84000 {
                  label = "image-1";
                  reg = <0x84000 0x74000>;
              };
              storage_partition: partition@f8000 {
                  label = "storage";
                  reg = <0xf8000 DT_SIZE_K(32)>;
              };
          };
      };

      / {
          chosen {
              zephyr,code-partition = &boot_partition;
          };
      };

logger:
  logs:
    canbus: INFO

canbus:
  - platform: zephyr_can
    id: can_bus
    can_id: 0
    bit_rate: 125kbps
    rx_pin: PA11
    tx_pin: PA12
    # every received frame blinks the LED
    on_frame:
      can_id: 0
      can_id_mask: 0
      then:
        - script.execute: frame_blink

script:
  - id: frame_blink
    mode: restart
    then:
      - output.turn_on: led_output
      - delay: 20ms
      - output.turn_off: led_output

canopen:
  id: can_gate
  canbus_id: can_bus
  node_id: 0x7f
  heartbeat_interval: 5s

canopen_entity_mapper:
  canopen_id: can_gate
  remote_nodes:
    dimmer4: ../../zrodlana/esphome/dimmer4.yaml

output:
  - platform: gpio
    pin: 5  # PA5, LD2
    id: led_output

binary_sensor:
  # B1 USER: PC13, low while pressed
  - platform: gpio
    id: user_button
    pin:
      number: PC13
      inverted: true
    filters:
      - delayed_on_off: 20ms
    on_press:
      - canopen.light.toggle: {node: dimmer4, entity: light5}  # biuro
